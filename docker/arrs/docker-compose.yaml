---
networks:
  proxy:
    external: true
  arrs:

volumes:
  sabnzbd: {}
  jellyseerr: {}
  bazarr: {}
  sonarr: {}
  readarr: {}
  lidarr: {}
  radarr: {}
  prowlarr: {}
  mediathekarr: {}
  configarr: {}
  downloads_completed:
    driver_opts:
      type: "nfs"
      o: "nfsvers=4,addr=192.168.1.14,rw"
      device: ":/mnt/pool-main/media/downloads/completed"
  downloads_incompleted:
    driver_opts:
      type: "nfs"
      o: "nfsvers=4,addr=192.168.1.14,rw"
      device: ":/mnt/pool-main/media/downloads/incompleted"
  media_tv:
    driver_opts:
      type: "nfs"
      o: "nfsvers=4,addr=192.168.1.14,rw"
      device: ":/mnt/pool-main/media/tv"
  media_books:
    driver_opts:
      type: "nfs"
      o: "nfsvers=4,addr=192.168.1.14,rw"
      device: ":/mnt/pool-main/media/books"
  media_music:
    driver_opts:
      type: "nfs"
      o: "nfsvers=4,addr=192.168.1.14,rw"
      device: ":/mnt/pool-main/media/music"
  media_movies:
    driver_opts:
      type: "nfs"
      o: "nfsvers=4,addr=192.168.1.14,rw"
      device: ":/mnt/pool-main/media/movies"

services:
  sabnzbd:
    networks: [ arrs, proxy ]
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
    container_name: sabnzbd
    image: ghcr.io/linuxserver/sabnzbd:5.1.3@sha256:693c208f697d0b411410edd92a98b52c8c754c01f5c078a975cbc892044260f5
    volumes:
      - sabnzbd:/config
      - downloads_completed:/downloads # completed directory for downloads. this contains the category directories
      - downloads_incompleted:/incomplete-downloads # "temp" directory for downloads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.entryPoints=websecure"
      - "traefik.http.routers.sabnzbd.tls.certResolver=production"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.$DOMAIN`)"
      - "traefik.http.routers.sabnzbd.tls.domains[0].main=$DOMAIN"
      - "traefik.http.routers.sabnzbd.tls.domains[0].sans=*.$DOMAIN"
      - "traefik.http.routers.sabnzbd.tls=true"
      - "traefik.docker.network=proxy"

  seerr:
    networks: [ arrs, proxy ]
    restart: unless-stopped
    image: ghcr.io/seerr-team/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.seerr.entryPoints=websecure"
      - "traefik.http.routers.seerr.tls.certResolver=production"
      - "traefik.http.routers.seerr.rule=Host(`request.$DOMAIN`)"
      - "traefik.http.routers.seerr.tls.domains[0].main=$DOMAIN"
      - "traefik.http.routers.seerr.tls.domains[0].sans=*.$DOMAIN"
      - "traefik.http.routers.seerr.tls=true"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    volumes:
      - jellyseerr:/app/config

  sonarr:
    networks: [ arrs, proxy ]
    restart: unless-stopped
    image: ghcr.io/linuxserver/sonarr:4.0.20@sha256:3b8c947d7fa173f70e40047d2c8d02835fb8416aeb5ae36def57d9ad15e2f906
    container_name: sonarr
    environment:
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:sonarr
      - TP_THEME=organizr
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
    volumes:
      - sonarr:/config
      - media_tv:/tv
      - downloads_completed:/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.sonarr.entryPoints=websecure"
      - "traefik.http.routers.sonarr.tls.certResolver=production"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.$DOMAIN`)"
      - "traefik.http.routers.sonarr.tls.domains[0].main=$DOMAIN"
      - "traefik.http.routers.sonarr.tls.domains[0].sans=*.$DOMAIN"

  bazarr:
    networks: [ arrs, proxy ]
    restart: unless-stopped
    image: ghcr.io/linuxserver/bazarr:1.6.2@sha256:7ef0e58216900dbce30b123e0eb65f5cb30e36f126de9474acdd2022fb069c54
    container_name: bazarr
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
    volumes:
      - bazarr:/config
      - media_tv:/media/tv
      - media_movies:/media/movies
      - media_books:/media/books
      - media_music:/media/music
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.bazarr.entryPoints=websecure"
      - "traefik.http.routers.bazarr.tls.certResolver=production"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.$DOMAIN`)"
      - "traefik.http.routers.bazarr.tls.domains[0].main=$DOMAIN"
      - "traefik.http.routers.bazarr.tls.domains[0].sans=*.$DOMAIN"
  
  readarr:
    networks: [ arrs, proxy ]
    restart: unless-stopped
    image: ghcr.io/linuxserver/readarr:0.4.19-nightly@sha256:4f291128d1a5538be73c2a30473d7cdd0820e223dc8b8533b0cbc5659000dcbe
    container_name: readarr
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
    volumes:
      - readarr:/config
      - media_books:/books
      - downloads_completed:/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.readarr.entryPoints=websecure"
      - "traefik.http.routers.readarr.tls.certResolver=production"
      - "traefik.http.routers.readarr.rule=Host(`readarr.$DOMAIN`)"
      - "traefik.http.routers.readarr.tls.domains[0].main=$DOMAIN"
      - "traefik.http.routers.readarr.tls.domains[0].sans=*.$DOMAIN"
  
  lidarr:
    networks: [ arrs, proxy ]
    restart: unless-stopped
    image: ghcr.io/linuxserver/lidarr:3.1.6@sha256:d5707cfe084da21a3864c7ef0edd9c0543b5e26c79c551f84dad5ef8683af8c7
    container_name: lidarr
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
    volumes:
      - lidarr:/config
      - media_music:/music
      - downloads_completed:/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.lidarr.entryPoints=websecure"
      - "traefik.http.routers.lidarr.tls.certResolver=production"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.$DOMAIN`)"
      - "traefik.http.routers.lidarr.tls.domains[0].main=$DOMAIN"
      - "traefik.http.routers.lidarr.tls.domains[0].sans=*.$DOMAIN"
  
  radarr:
    networks: [ arrs, proxy ]
    restart: unless-stopped
    image: ghcr.io/linuxserver/radarr:6.4.4@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
    container_name: radarr
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
    volumes:
      - radarr:/config
      - media_movies:/movies
      - downloads_completed:/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.radarr.entryPoints=websecure"
      - "traefik.http.routers.radarr.tls.certResolver=production"
      - "traefik.http.routers.radarr.rule=Host(`radarr.$DOMAIN`)"
      - "traefik.http.routers.radarr.tls.domains[0].main=$DOMAIN"
      - "traefik.http.routers.radarr.tls.domains[0].sans=*.$DOMAIN"
  
  prowlarr:
    networks: [ arrs, proxy ]
    restart: unless-stopped
    image: ghcr.io/linuxserver/prowlarr:2.7.0@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    container_name: prowlarr
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
    volumes:
      - prowlarr:/config
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.prowlarr.entryPoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certResolver=production"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.$DOMAIN`)"
      - "traefik.http.routers.prowlarr.tls.domains[0].main=$DOMAIN"
      - "traefik.http.routers.prowlarr.tls.domains[0].sans=*.$DOMAIN"

  umlautadaptarr:
    networks: [ arrs, proxy ]
    restart: unless-stopped
    container_name: umlautadaptarr
    ports:
      - "5006:5006"
    image: pcjones/umlautadaptarr:0.7.6@sha256:67da75db94795ef250b6a3ec9ddd25f3d0848329d48c0b8884762069ae93d08c
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
      - SONARR__ENABLED=true
      - SONARR__HOST=https://sonarr.$DOMAIN
      - SONARR__APIKEY=$SONARR_APIKEY
      - RADARR__ENABLED=true
      - RADARR__HOST=https://radarr.$DOMAIN
      - RADARR__APIKEY=$RADARR_APIKEY
      - READARR__ENABLED=true
      - READARR__HOST=https://readarr.$DOMAIN
      - READARR__APIKEY=$READARR_APIKEY
      - LIDARR__ENABLED=true
      - LIDARR__HOST=https://lidarr.$DOMAIN
      - LIDARR__APIKEY=$LIDARR_APIKEY

  mediathekarr:
    networks: [ arrs, proxy ]
    restart: unless-stopped
    image: pcjones/mediathekarr:beta@sha256:3ed7e1487810e1519301bd56a0c420e260e428295b029a47806c0397e4a52a33
    container_name: mediathekarr
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
      - DOWNLOAD_INCOMPLETE_PATH=/incomplete-downloads
      - DOWNLOAD_COMPLETE_PATH=/downloads
      - MEDIATHEKARR_API_BASE_URL=https://mediathekarr.pcjones.de/api/v1
    volumes:
      - mediathekarr:/app/config
      - downloads_completed:/downloads
      - downloads_incompleted:/incomplete-downloads
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.mediathekarr.entryPoints=websecure"
      - "traefik.http.routers.mediathekarr.tls.certResolver=production"
      - "traefik.http.routers.mediathekarr.rule=Host(`mediathekarr.$DOMAIN`)"
      - "traefik.http.routers.mediathekarr.tls.domains[0].main=$DOMAIN"
      - "traefik.http.routers.mediathekarr.tls.domains[0].sans=*.$DOMAIN"

  configarr:
    networks: [ arrs, proxy ]
    restart: unless-stopped
    image: ghcr.io/raydak-labs/configarr:1.39.1@sha256:e61e12c776f33d2e14a8d7ded4b27fc7253181df9b8fd3a6c7e510f323cf8f46
    container_name: configarr
    volumes:
      - configarr:/app
    environment:
      - TZ=Europe/Berlin