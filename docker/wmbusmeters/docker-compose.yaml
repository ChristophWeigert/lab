---
volumes:
  wmbusmeters:

services:
  wmbusmeters:
    image: wmbusmeters/wmbusmeters:latest@sha256:fe83020ca30f9beb3a7135b3eac2bc9790c8739f93ed2a1a1842d292bcfd6e8b
    container_name: wmbusmeters
    privileged: true
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      # wmbusmeters keeps running without a dongle, so check the serial port is open
      test: ['CMD-SHELL', 'ls -l /proc/[0-9]*/fd 2>/dev/null | grep -q ttyACM']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - wmbusmeters:/wmbusmeters_data
      - /etc/localtime:/etc/localtime:ro
      - /dev/:/dev/
    environment:
      - TZ=Europe/Berlin
      - MQTT_PORT=$MQTT_PORT
      - MQTT_PASSWORD=$MQTT_PASSWORD
      - MQTT_USER=$MQTT_USER
      - MQTT_HOST=$MQTT_HOST

  autoheal:
    image: willfarrell/autoheal:latest@sha256:7c9c34206a6c30dbc67a2d4f9b54adf0aec32348cf18c7e25f34452a56eea94e
    container_name: wmbusmeters-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
