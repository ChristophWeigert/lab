---
volumes:
  wmbusmeters:

services:
  wmbusmeters:
    image: wmbusmeters/wmbusmeters:latest@sha256:2e4e1382ca64b227e41ef6eefd2c9ba862e5da93e5c3b379ae27886d78280077
    container_name: wmbusmeters
    privileged: true
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      # wmbusmeters keeps running without a dongle, so check the serial port is open
      test: ['CMD-SHELL', 'ls -l /proc/[0-9]*/fd 2>/dev/null | grep -q ttyACM']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - wmbusmeters:/wmbusmeters_data
      - /etc/localtime:/etc/localtime:ro
      - /dev/:/dev/
    environment:
      - TZ=Europe/Berlin
      - MQTT_PORT=$MQTT_PORT
      - MQTT_PASSWORD=$MQTT_PASSWORD
      - MQTT_USER=$MQTT_USER
      - MQTT_HOST=$MQTT_HOST

  autoheal:
    image: willfarrell/autoheal:latest@sha256:a32dfc9bfbd4beb0d467e406d4ee6786765e7544552670189383408ece4f3abe
    container_name: wmbusmeters-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
