---
volumes:
  wmbusmeters:

services:
  wmbusmeters:
    image: wmbusmeters/wmbusmeters:latest@sha256:f1bca4ac0d6aca0f0d3b81a0a33c9b505c7226c684903f23666cc12a0c152e59
    container_name: wmbusmeters
    privileged: true
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      # wmbusmeters keeps running without a dongle, so check the serial port is open
      test: ['CMD-SHELL', 'ls -l /proc/[0-9]*/fd 2>/dev/null | grep -q ttyACM']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - wmbusmeters:/wmbusmeters_data
      - /etc/localtime:/etc/localtime:ro
      - /dev/:/dev/
    environment:
      - TZ=Europe/Berlin
      - MQTT_PORT=$MQTT_PORT
      - MQTT_PASSWORD=$MQTT_PASSWORD
      - MQTT_USER=$MQTT_USER
      - MQTT_HOST=$MQTT_HOST

  autoheal:
    image: willfarrell/autoheal:latest@sha256:c4227b7a25b8ef08829ad3ad440af3a821e4277c9b1b2050a3f671ad9d87bfc6
    container_name: wmbusmeters-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
