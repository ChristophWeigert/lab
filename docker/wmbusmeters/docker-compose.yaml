---
volumes:
  wmbusmeters:

services:
  wmbusmeters:
    image: wmbusmeters/wmbusmeters:latest@sha256:4a8c06036aa0b2ec198d13056bbf0785dda007b3c8e8ebe0a9f3bd4b66ae2ba2
    container_name: wmbusmeters
    privileged: true
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      # wmbusmeters keeps running without a dongle, so check the serial port is open
      test: ['CMD-SHELL', 'ls -l /proc/[0-9]*/fd 2>/dev/null | grep -q ttyACM']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - wmbusmeters:/wmbusmeters_data
      - /etc/localtime:/etc/localtime:ro
      - /dev/:/dev/
    environment:
      - TZ=Europe/Berlin
      - MQTT_PORT=$MQTT_PORT
      - MQTT_PASSWORD=$MQTT_PASSWORD
      - MQTT_USER=$MQTT_USER
      - MQTT_HOST=$MQTT_HOST

  autoheal:
    image: willfarrell/autoheal:latest@sha256:a4645c87683564c02154fbfb056eba3431cdb32b48c923359c3d55c4ec56ce89
    container_name: wmbusmeters-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
