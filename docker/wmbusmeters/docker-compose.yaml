---
volumes:
  wmbusmeters:

services:
  wmbusmeters:
    image: wmbusmeters/wmbusmeters:release-3.1.1@sha256:bc36af48c90c2823d66faa09637343bd0a39947efa0dfd6ab4b098424c3c633d
    container_name: wmbusmeters
    privileged: true
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      # wmbusmeters keeps running without a dongle, so check the serial port is open
      test: ['CMD-SHELL', 'ls -l /proc/[0-9]*/fd 2>/dev/null | grep -q ttyACM']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - wmbusmeters:/wmbusmeters_data
      - /etc/localtime:/etc/localtime:ro
      - /dev/:/dev/
    environment:
      - TZ=Europe/Berlin
      - MQTT_PORT=$MQTT_PORT
      - MQTT_PASSWORD=$MQTT_PASSWORD
      - MQTT_USER=$MQTT_USER
      - MQTT_HOST=$MQTT_HOST

  autoheal:
    # latest on purpose: the last release (1.2.0, 2021) is far older than the rebuilt latest image
    image: willfarrell/autoheal:latest@sha256:02bcb7b529d0e51424b2e9b67b43f639af454258924ab3a3b97f1cc7e6da367f
    container_name: wmbusmeters-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
