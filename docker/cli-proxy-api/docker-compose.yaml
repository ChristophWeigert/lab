networks:
  proxy:
    external: true

volumes:
  cli_proxy_api_config: {}
  cli_proxy_api_auths: {}
  cli_proxy_api_logs: {}

services:
  cli-proxy-api:
    container_name: cli-proxy-api
    image: eceasy/cli-proxy-api:v8.0.48@sha256:c198886a86b57f49cb2508a68b6170e23b2d509c648934af5d5dd827cf6faa16
    networks:
      - proxy
    # No config file needed: seed a minimal one into the volume on first start.
    # API keys and providers are then managed in the UI and saved to that volume.
    entrypoint:
      - sh
      - -c
      - |
        [ -f /CLIProxyAPI/config/config.yaml ] || cat > /CLIProxyAPI/config/config.yaml <<'YAML'
        port: 8317
        # Keep a Claude Code session on one account so its prompt cache stays warm.
        routing:
          strategy: round-robin
          session-affinity: true
          session-affinity-ttl: 1h
          retry:
            request-retry: 3
            max-retry-interval: 30
        YAML
        exec ./CLIProxyAPI -config /CLIProxyAPI/config/config.yaml
    environment:
      # Login key for the UI at /management.html; also enables remote management.
      - MANAGEMENT_PASSWORD=${MANAGEMENT_PASSWORD}
      - TZ=Europe/Berlin
    volumes:
      - cli_proxy_api_config:/CLIProxyAPI/config
      - cli_proxy_api_auths:/root/.cli-proxy-api
      - cli_proxy_api_logs:/CLIProxyAPI/logs
    labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy"
        - "traefik.http.routers.cli-proxy-api.entryPoints=websecure"
        - "traefik.http.routers.cli-proxy-api.tls.certResolver=production"
        - "traefik.http.routers.cli-proxy-api.rule=Host(`cliproxy.$DOMAIN`)"
        - "traefik.http.services.cli-proxy-api.loadbalancer.server.port=8317"
        - "traefik.http.routers.cli-proxy-api.tls.domains[0].main=$DOMAIN"
        - "traefik.http.routers.cli-proxy-api.tls.domains[0].sans=*.$DOMAIN"
        - "traefik.http.routers.cli-proxy-api.tls=true"
    restart: unless-stopped
