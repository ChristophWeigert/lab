---
volumes:
  teamspeak_data:

services:
  teamspeak:
    image: teamspeak:3.13.8@sha256:4833e67ffe7ecaaef63241be145f65720ee6a927a2c83029a7fa762c902dd3b2
    restart: always
    ports:
      - "10011:10011/tcp"
      - "1337:1337/udp"
      - "30033:30033/tcp"
      - "9987:9987/udp"
    environment:
      TS3SERVER_LICENSE: accept
      TIME_ZONE: Europe/Berlin
    volumes:
      - teamspeak_data:/var/ts3server/
